stages: [test, sync]

test:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install -r requirements.txt
  script:
    - python -m unittest discover -s tests -t .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'

# Gemeinsame Vorlage für den Abruf und Versand.
# Der Zustand (state.json) wird als Artifact aufbewahrt; der nächste Lauf holt ihn
# vom letzten erfolgreichen Lauf desselben Jobs auf demselben Branch (siehe servicehealth_sync/state.py).
# Test und Produktion haben dadurch getrennte Zustände.
.sync-service-health:
  stage: sync
  image: python:3.12-slim
  timeout: 10m
  before_script:
    - pip install -r requirements.txt
  script:
    - python -m servicehealth_sync
  artifacts:
    paths:
      - state.json
    expire_in: 90 days

# Branch "main" -> Environment "Test".
# Läuft per Pipeline-Schedule (CI/CD -> Schedules, Ziel-Branch main) oder manuell über "Run pipeline".
# Der Jobname bleibt unverändert, damit der bisherige Zustand aus main weiter gefunden wird.
sync-service-health:
  extends: .sync-service-health
  environment:
    name: Test   # Groß-/Kleinschreibung muss exakt dem Environment scope der CI/CD-Variablen entsprechen
  resource_group: servicehealth-sync-test   # verhindert überlappende Läufe
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"'

# Branch "production" -> Environment "Production".
# Schedule mit Ziel-Branch production anlegen.
sync-service-health-production:
  extends: .sync-service-health
  environment:
    name: Production
  resource_group: servicehealth-sync-production
  rules:
    - if: '$CI_COMMIT_BRANCH == "production" && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "production" && $CI_PIPELINE_SOURCE == "web"'
